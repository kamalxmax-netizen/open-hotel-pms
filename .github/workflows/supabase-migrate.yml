name: Supabase Database Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check migration files
        run: |
          echo "Supabase migration files:"
          find supabase/migrations -maxdepth 1 -type f -name "*.sql" | sort | head -20

      - name: Install Supabase CLI beta
        run: |
          npm install -g supabase@beta

      - name: Link Supabase project without pooler
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD" \
            --skip-pooler

      - name: Push database migrations
        run: |
          supabase db push --linked